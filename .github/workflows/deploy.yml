name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [sanity-content-update]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Configure site URL
        env:
          SITE_URL_VAR: ${{ vars.SITE_URL }}
          BASE_PATH_VAR: ${{ vars.BASE_PATH }}
        run: |
          owner="${GITHUB_REPOSITORY%/*}"
          repository="${GITHUB_REPOSITORY#*/}"

          if [ -n "$SITE_URL_VAR" ]; then
            echo "SITE_URL=${SITE_URL_VAR%/}" >> "$GITHUB_ENV"
            echo "BASE_PATH=$BASE_PATH_VAR" >> "$GITHUB_ENV"
          elif [ "${repository,,}" = "${owner,,}.github.io" ]; then
            echo "SITE_URL=https://${owner}.github.io" >> "$GITHUB_ENV"
            echo "BASE_PATH=" >> "$GITHUB_ENV"
          else
            echo "SITE_URL=https://${owner}.github.io/${repository}" >> "$GITHUB_ENV"
            echo "BASE_PATH=/${repository}" >> "$GITHUB_ENV"
          fi
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
